version: '3.9'

# Local development stack for the Karrkarr Fleet Leasing Platform.
#   docker compose -f infra/docker-compose.yml up -d
# Postgres holds all business state. Redis backs BullMQ queues (reminders,
# interest accrual, expiry alerts). MinIO stands in for AWS S3 locally so the
# document/proof upload path is exercised identically in dev and prod.

services:
  postgres:
    image: postgres:16-alpine
    container_name: karrkarr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: karrkarr
      POSTGRES_PASSWORD: karrkarr_dev_password
      POSTGRES_DB: karrkarr_fleet
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U karrkarr -d karrkarr_fleet']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: karrkarr-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: karrkarr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: karrkarr_minio
      MINIO_ROOT_PASSWORD: karrkarr_minio_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
